<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy Conversion Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F2E9;
    --surface: #FFFFFF;
    --surface-alt: #EFE7D6;
    --text: #211D17;
    --text-muted: #6F6656;
    --border: #E1D6BE;
    --border-strong: #C9BB9C;
    --accent: #1B6B79;
    --accent-strong: #124D57;
    --accent-tint: #E3EFEE;
    --cat-petroleum: #A6531B;
    --cat-coal: #4A4038;
    --cat-gas: #1B6B79;
    --cat-electricity: #9C7412;
    --shadow: 0 1px 2px rgba(33, 29, 23, 0.06), 0 8px 24px rgba(33, 29, 23, 0.05);
    --focus: #1B6B79;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16130E;
      --surface: #1E1A13;
      --surface-alt: #262019;
      --text: #EDE6D6;
      --text-muted: #A99C82;
      --border: #383026;
      --border-strong: #4A4032;
      --accent: #58B9C4;
      --accent-strong: #86D2DA;
      --accent-tint: #223034;
      --cat-petroleum: #DE8A4E;
      --cat-coal: #B9AC98;
      --cat-gas: #58B9C4;
      --cat-electricity: #D8AE4C;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
      --focus: #58B9C4;
    }
  }

  :root[data-theme="dark"] {
    --bg: #16130E;
    --surface: #1E1A13;
    --surface-alt: #262019;
    --text: #EDE6D6;
    --text-muted: #A99C82;
    --border: #383026;
    --border-strong: #4A4032;
    --accent: #58B9C4;
    --accent-strong: #86D2DA;
    --accent-tint: #223034;
    --cat-petroleum: #DE8A4E;
    --cat-coal: #B9AC98;
    --cat-gas: #58B9C4;
    --cat-electricity: #D8AE4C;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    --focus: #58B9C4;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  ::selection { background: var(--accent-tint); color: var(--accent-strong); }

  a { color: var(--accent-strong); }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 28px 72px;
  }

  header.page {
    padding-bottom: 28px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--accent-strong);
    background: var(--accent-tint);
    padding: 5px 10px 5px 8px;
    border-radius: 100px;
    margin-bottom: 16px;
  }
  .eyebrow svg { width: 13px; height: 13px; flex: none; }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(30px, 4vw, 42px);
    line-height: 1.08;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
    text-wrap: balance;
    color: var(--text);
  }
  .dek {
    max-width: 62ch;
    color: var(--text-muted);
    font-size: 15.5px;
    margin: 0 0 4px;
  }
  .dek strong { color: var(--text); font-weight: 600; }
  .source-line {
    margin-top: 14px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* toolbar */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--bg);
    padding: 14px 0 14px;
    margin-bottom: 4px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .search-box {
    position: relative;
    flex: 1 1 240px;
    max-width: 340px;
  }
  .search-box svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    color: var(--text-muted);
    pointer-events: none;
  }
  .search-box input {
    width: 100%;
    font: inherit;
    font-size: 14px;
    padding: 9px 12px 9px 34px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
  }
  .search-box input:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 100px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dot, var(--text-muted)); flex: none; }
  .chip[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .chip[aria-pressed="true"] .dot { background: #fff; }

  .count {
    margin-left: auto;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* table */
  .table-shell {
    margin-top: 18px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .table-scroll {
    overflow: auto;
    max-height: 68vh;
  }
  table {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    min-width: 1400px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }
  thead th {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--surface-alt);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    text-align: right;
    padding: 11px 14px;
    border-bottom: 1px solid var(--border-strong);
    white-space: nowrap;
  }
  thead th span.unit-hint {
    display: block;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    color: var(--text-muted);
    opacity: 0.75;
    margin-top: 2px;
  }
  thead th.col-name, thead th.col-unit { text-align: left; }

  th.col-name, td.col-name {
    position: sticky;
    left: 0;
    z-index: 4;
    background: var(--surface);
    text-align: left;
    font-family: "IBM Plex Sans", sans-serif;
    width: 300px;
    min-width: 300px;
    max-width: 300px;
    white-space: normal;
  }
  th.col-unit, td.col-unit {
    position: sticky;
    left: 300px;
    z-index: 4;
    background: var(--surface);
    border-right: 1px solid var(--border);
    width: 108px;
    min-width: 108px;
    max-width: 108px;
    white-space: nowrap;
  }
  thead th.col-name, thead th.col-unit { z-index: 6; background: var(--surface-alt); }

  tbody tr td { border-bottom: 1px solid var(--border); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--accent-tint); }
  tbody tr:hover td.col-name, tbody tr:hover td.col-unit { background: var(--accent-tint); }

  td { padding: 10px 14px; text-align: right; font-size: 13px; white-space: nowrap; }
  td.col-name {
    font-size: 13.5px;
    padding-left: 16px;
    border-left: 3px solid var(--row-accent, transparent);
  }
  td.col-unit { color: var(--text-muted); font-size: 12.5px; }
  td.num-na { color: var(--text-muted); opacity: 0.55; }
  .fuel-name { color: var(--text); }
  .fuel-note {
    display: block;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  .group-row td {
    background: var(--surface-alt);
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    text-align: left;
    padding: 8px 14px 8px 16px;
    position: sticky;
    left: 0;
    border-bottom: 1px solid var(--border);
  }
  .group-row .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 8px; background: var(--row-accent); vertical-align: middle; }

  .no-results { padding: 40px 16px; text-align: center; color: var(--text-muted); font-size: 14px; }
  .no-results[hidden] { display: none; }

  @media (max-width: 640px) {
    .wrap { padding: 28px 16px 56px; }
    .toolbar { top: 0; }
  }
</style>
</head>

    <h1>Energy Conversion Table</h1>

  <div class="toolbar">

    <div class="chips" id="chips" role="group" aria-label="Filter by category">

    <span class="count" id="rowCount"></span>

  <div class="table-shell">

      <table>
        <thead>

            <th>Liters<span class="unit-hint">L</span></th>
            <th>Cubic Feet<span class="unit-hint">ft³</span></th>
            <th>Cubic Meters<span class="unit-hint">m³</span></th>
            <th>Short Tons<span class="unit-hint">2,000 lb</span></th>
            <th>Metric Tons<span class="unit-hint">1,000 kg</span></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p class="no-results" id="noResults" hidden>No commodities match your search.</p>
  </div>
</div>

  const CAT_LABEL = {
    petroleum: "Petroleum & Biofuels",
    coal: "Coal",
    gas: "Natural Gas",
    electricity: "Electricity"
  };
  const CAT_VAR = {
    petroleum: "--cat-petroleum",
    coal: "--cat-coal",
    gas: "--cat-gas",
    electricity: "--cat-electricity"
  };

  const tbody = document.getElementById("tbody");
  const searchInput = document.getElementById("search");
  const chips = Array.from(document.querySelectorAll(".chip"));
  const rowCountEl = document.getElementById("rowCount");
  const noResultsEl = document.getElementById("noResults");

  let activeCat = "all";

  function cell(value, extraClass) {
    if (value === null || value === undefined) {
      return `<td class="num-na${extraClass ? " " + extraClass : ""}">—</td>`;
    }
    return `<td${extraClass ? ` class="${extraClass}"` : ""}>${value}</td>`;
  }

  function render() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = ROWS.filter(r => {
      const matchesCat = activeCat === "all" || r.category === activeCat;
      const matchesQ = !q || r.name.toLowerCase().includes(q) || r.unit.toLowerCase().includes(q);
      return matchesCat && matchesQ;
    });

    tbody.innerHTML = "";
    let lastCat = null;

    if (filtered.length === 0) {
      noResultsEl.hidden = false;
    } else {
      noResultsEl.hidden = true;
      for (const r of filtered) {
        if (r.category !== lastCat) {
          const groupTr = document.createElement("tr");
          groupTr.className = "group-row";
          groupTr.style.setProperty("--row-accent", `var(${CAT_VAR[r.category]})`);
          groupTr.innerHTML = `<td colspan="12"><span class="dot"></span>${CAT_LABEL[r.category]}</td>`;
          tbody.appendChild(groupTr);
          lastCat = r.category;
        }
        const tr = document.createElement("tr");
        tr.style.setProperty("--row-accent", `var(${CAT_VAR[r.category]})`);
        tr.innerHTML = [
          `<td class="col-name"><span class="fuel-name">${r.name}</span>${r.note ? `<span class="fuel-note">${r.note}</span>` : ""}</td>`,
          `<td class="col-unit">${r.unit}</td>`,
          cell(r.mbtu),
          cell(r.mj),
          cell(r.kwh),
          cell(r.therms),
          cell(r.gal),
          cell(r.liters),
          cell(r.cf),
          cell(r.m3),
          cell(r.st),
          cell(r.mt)
        ].join("");
        tbody.appendChild(tr);
      }
    }

    rowCountEl.textContent = `${filtered.length} of ${ROWS.length} commodities`;
  }

  searchInput.addEventListener("input", render);
  chips.forEach(chip => {
    chip.addEventListener("click", () => {
      activeCat = chip.dataset.cat;
      chips.forEach(c => c.setAttribute("aria-pressed", String(c === chip)));
      render();
    });
  });

  render();
</script>
