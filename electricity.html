<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fractionator's Electricity Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<style>
  #eb-root, #eb-root * { box-sizing: border-box; }
  #eb-root {
    background: #fafaf9;
    color: #242430;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 1160px;
    margin: 0 auto;
    border: 1px solid #e2e2e6;
    border-radius: 10px;
  }
  #eb-root h1, #eb-root h2, #eb-root h3 { font-family: "Jost", system-ui, sans-serif; margin: 0; }
  #eb-root button { font-family: inherit; cursor: pointer; }
  #eb-root input { font-family: inherit; }
  #eb-root .num { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  #eb-root .eb-header { background: #232a4a; padding: 22px 32px; display: flex; flex-direction: column; gap: 4px; border-radius: 9px 9px 0 0; }
  #eb-root .eb-header-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #eb-root .eb-eyebrow { font-family: "Jost", sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .12em; color: #a8b8d8; text-transform: uppercase; }
  #eb-root .eb-badge { font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 2px 8px; border-radius: 3px; text-transform: uppercase; }
  #eb-root .eb-badge-live { color: #16311f; background: #8fe0a8; }
  #eb-root .eb-badge-off { color: #232a4a; background: #e8c25c; }
  #eb-root .eb-title { font-size: 26px; font-weight: 600; color: #fff; }
  #eb-root .eb-sub { margin: 0; font-size: 14px; color: #cfd5e6; max-width: 660px; }

  #eb-root .eb-content { padding: 26px 32px 56px; display: flex; flex-direction: column; gap: 22px; }
  #eb-root .eb-section-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #6f6f79; }
  #eb-root .eb-sub-label { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #8f8f97; margin-bottom: 4px; }

  #eb-root .eb-key-bar { background: #fff; border: 1.5px solid #d4d4d9; border-radius: 8px; padding: 14px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #eb-root .eb-key-bar input[type="password"], #eb-root .eb-key-bar input[type="text"] {
    flex: 1 1 260px; min-width: 200px; border: 1.5px solid #d4d4d9; border-radius: 6px; padding: 8px 10px; font-size: 13px;
  }
  #eb-root .eb-key-status { font-size: 12.5px; color: #6f6f79; }
  #eb-root .eb-key-status.eb-key-ok { color: #1f7a3f; font-weight: 600; }

  #eb-root .eb-dd-trigger {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: #fff; border: 1.5px solid #d4d4d9; border-radius: 6px;
    padding: 9px 11px 9px 13px; font-size: 13.5px; font-weight: 600; color: #33333c;
  }
  #eb-root .eb-dd-trigger:focus-visible, #eb-root button:focus-visible { outline: 2px solid #3a6fd8; outline-offset: 1px; }
  #eb-root .eb-dd-panel {
    position: absolute; top: calc(100% + 4px); left: 0; background: #fff;
    border: 1px solid #d4d4d9; border-radius: 6px; box-shadow: 0 8px 20px rgba(20,20,30,.14);
    padding: 5px; z-index: 40; display: flex; flex-direction: column; gap: 1px;
  }
  #eb-root .eb-dd-row {
    display: flex; align-items: center; gap: 9px; text-align: left; background: #fff;
    border: none; border-radius: 4px; padding: 7px 8px; font-size: 13px; width: 100%; color: #2c2c34;
  }
  #eb-root .eb-dd-row:hover, #eb-root .eb-dd-row:focus-visible { background: #f1f1f4; }
  #eb-root .eb-dd-row[aria-selected="true"] { background: #e8ecf7; font-weight: 600; }
  #eb-root .eb-dd-cat-label { font-size: 11.5px; font-weight: 600; color: #8f8f97; padding: 9px 8px 4px; }
  #eb-root .eb-swatch-box { width: 14px; height: 14px; border-radius: 3px; flex: none; display: inline-block; border: 1.5px solid; }
  #eb-root .eb-check { width: 14px; flex: none; text-align: center; color: #232a4a; font-weight: 700; }

  #eb-root .eb-nodata, #eb-root .eb-keyprompt {
    background: #fff; border: 1.5px dashed #cfcfd4; border-radius: 8px; padding: 44px 24px;
    text-align: center; color: #6f6f79; font-size: 14px; line-height: 1.6;
  }

  #eb-root .eb-toolbar {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap;
    border-top: 1px solid #e2e2e6; border-bottom: 1px solid #e2e2e6; padding: 16px 0;
  }
  #eb-root .eb-filters { display: flex; gap: 14px; flex-wrap: wrap; }
  #eb-root .eb-dd-wrap { position: relative; }
  #eb-root .eb-freq { display: flex; border: 1.5px solid #d4d4d9; border-radius: 6px; overflow: hidden; }
  #eb-root .eb-freq button { border: none; padding: 8px 14px; font-size: 13px; font-weight: 600; background: #fff; color: #33333c; }
  #eb-root .eb-freq button[aria-pressed="true"] { background: #232a4a; color: #fff; }
  #eb-root .eb-btn {
    display: flex; align-items: center; gap: 7px; background: #fff; border: 1.5px solid #d4d4d9;
    border-radius: 6px; padding: 8px 14px; font-size: 13px; font-weight: 600; color: #33333c;
  }
  #eb-root .eb-btn-sm { padding: 6px 11px; font-size: 12.5px; }
  #eb-root .eb-btn:hover { background: #f5f5f7; }
  #eb-root .eb-btn:disabled { opacity: .5; cursor: default; }
  #eb-root .eb-link-btn { background: none; border: none; padding: 0; font-size: 12.5px; font-weight: 600; color: #3a6fd8; }
  #eb-root .eb-link-btn:hover { text-decoration: underline; }
  #eb-root .eb-note { font-size: 10.5px; color: #8a8a92; font-style: italic; }

  #eb-root .eb-api-panel { background: #28282f; border-radius: 8px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
  #eb-root .eb-api-title { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #a3a3ab; }
  #eb-root .eb-api-url { color: #a8e0b8; font-size: 12.5px; line-height: 1.6; word-break: break-all; }
  #eb-root .eb-api-body { color: #a8a8b0; font-size: 12.5px; line-height: 1.6; }

  #eb-root .eb-card { background: #fff; border: 1px solid #e2e2e6; border-radius: 8px; padding: 20px 22px; position: relative; min-height: 120px; }
  #eb-root .eb-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 10px; }
  #eb-root .eb-card-head h2 { font-size: 17px; font-weight: 600; }
  #eb-root .eb-card-meta { font-size: 12.5px; color: #6f6f79; }
  #eb-root .eb-notice { font-size: 11.5px; color: #a4431f; margin-top: 8px; }
  #eb-root .eb-loading, #eb-root .eb-error { padding: 30px 10px; text-align: center; color: #6f6f79; font-size: 13.5px; }
  #eb-root .eb-error { color: #a4431f; }

  #eb-root .eb-grid-card { padding: 4px 22px 18px; overflow-x: auto; }
  #eb-root .eb-grid-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 2px; flex-wrap: wrap; gap: 10px; }
  #eb-root .eb-grid-head h2 { font-size: 14px; font-weight: 600; color: #3d3d45; }
  #eb-root table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  #eb-root th, #eb-root td { padding: 8px 10px; border-bottom: 1.5px solid #dcdce0; }
  #eb-root thead th { text-align: right; color: #6f6f79; font-weight: 600; }
  #eb-root thead th:first-child { text-align: left; padding-left: 0; }
  #eb-root tbody th { text-align: left; font-weight: 400; padding-left: 0; border-bottom: 1px solid #e9e9ea; display: flex; align-items: center; gap: 8px; }
  #eb-root tbody td { text-align: right; border-bottom: 1px solid #e9e9ea; }

  #eb-root .eb-footer { font-size: 12px; color: #8a8a92; padding: 16px 32px 22px; }
</style>
</head>
<body>

<div id="eb-root">
  <div class="eb-header">
    <div class="eb-header-top">
      <span class="eb-eyebrow">EIA public data &middot; personal build</span>
      <span class="eb-badge" id="eb-live-badge">Sample data</span>
    </div>
    <h1 class="eb-title">Fractionator's Electricity Browser</h1>
    <p class="eb-sub">A lightweight personal view of EIA&rsquo;s electricity data, pulled live from the public Open Data API using your own free key.</p>
  </div>
  <div class="eb-content" id="eb-app"></div>
  <div class="eb-footer">Personal tool &middot; not an official EIA product &middot; built on EIA&rsquo;s public Open Data API</div>
</div>

<script>
(function () {
  "use strict";

  // ---- Route + facet ground truth, verified live against api.eia.gov -------
  var ROUTES = {
    epo:   { path: 'electricity/electric-power-operational-data', geoFacet: 'location', seriesFacet: 'fueltypeid', fixedFacets: { sectorid: '98' } },
    sales: { path: 'electricity/retail-sales', geoFacet: 'stateid', seriesFacet: 'sectorid', fixedFacets: null },
  };

  // The API's `length` param caps total ROWS returned, not periods — and each
  // period contributes one row per series requested. Ask for a few periods'
  // worth more than we intend to show, then trim to PERIODS_WANTED after
  // grouping, so a run cut short mid-period (an EIA row-cap artifact, not a
  // gap in the real data) never gets mistaken for missing data.
  var PERIODS_WANTED = 13;
  var PERIODS_BUFFER = 4;

  var FUEL5 = [
    { id: 'COW', label: 'Coal', color: '#6b7280' },
    { id: 'NG',  label: 'Natural gas', color: '#e8793c' },
    { id: 'NUC', label: 'Nuclear', color: '#8a5cc7' },
    { id: 'WND', label: 'Wind', color: '#4caf7d' },
    { id: 'SUN', label: 'Solar', color: '#e0b23e' },
  ];
  var FUEL3 = [
    { id: 'COW', label: 'Coal', color: '#6b7280' },
    { id: 'NG',  label: 'Natural gas', color: '#e8793c' },
    { id: 'PET', label: 'Petroleum', color: '#8a5cc7' },
  ];
  var SECTOR3 = [
    { id: 'RES', label: 'Residential', color: '#6b7280' },
    { id: 'COM', label: 'Commercial', color: '#e8793c' },
    { id: 'IND', label: 'Industrial', color: '#8a5cc7' },
  ];
  var SERIES_SETS = { fuel5: FUEL5, fuel3: FUEL3, sector3: SECTOR3 };

  var CATEGORIES = [
    {
      label: 'Electricity generation & consumption (EIA-906/EIA-920/EIA-923)',
      items: [
        { id: 'net-gen', label: 'Net generation', route: 'epo', dataKey: 'generation', seriesSet: 'fuel5' },
        { id: 'total-consumption', label: 'Total consumption', route: 'epo', dataKey: 'total-consumption', seriesSet: 'fuel3' },
        { id: 'total-consumption-btu', label: 'Total consumption (Btu)', route: 'epo', dataKey: 'total-consumption-btu', seriesSet: 'fuel3' },
        { id: 'consumption-gen', label: 'Consumption for electricity generation', route: 'epo', dataKey: 'consumption-for-eg', seriesSet: 'fuel3' },
        { id: 'consumption-gen-btu', label: 'Consumption for electricity generation (Btu)', route: 'epo', dataKey: 'consumption-for-eg-btu', seriesSet: 'fuel3' },
        { id: 'consumption-thermal', label: 'Consumption for useful thermal output', route: 'epo', dataKey: 'consumption-uto', seriesSet: 'fuel3' },
        { id: 'consumption-thermal-btu', label: 'Consumption for useful thermal output (Btu)', route: 'epo', dataKey: 'consumption-uto-btu', seriesSet: 'fuel3' },
      ],
    },
    {
      label: 'Sales of electricity (EIA-861/EIA-861M)',
      items: [
        { id: 'retail-sales', label: 'Retail sales of electricity', route: 'sales', dataKey: 'sales', seriesSet: 'sector3' },
        { id: 'revenue-retail', label: 'Revenue from retail sales of electricity', route: 'sales', dataKey: 'revenue', seriesSet: 'sector3' },
        { id: 'avg-retail-price', label: 'Average retail price of electricity', route: 'sales', dataKey: 'price', seriesSet: 'sector3' },
        { id: 'customer-accounts', label: 'Number of customer accounts', route: 'sales', dataKey: 'customers', seriesSet: 'sector3' },
      ],
    },
    {
      label: 'Fuel quality & receipts (EIA-423/EIA-923)',
      items: [
        { id: 'fossil-stocks', label: 'Fossil-fuel stocks for electricity generation', route: 'epo', dataKey: 'stocks', seriesSet: 'fuel3' },
        { id: 'receipts-fossil', label: 'Receipts of fossil fuels by electricity plants', route: 'epo', dataKey: 'receipts', seriesSet: 'fuel3' },
        { id: 'receipts-fossil-btu', label: 'Receipts of fossil fuels by electricity plants (Btu)', route: 'epo', dataKey: 'receipts-btu', seriesSet: 'fuel3' },
        { id: 'avg-cost-fossil', label: 'Average cost of fossil fuels for electricity generation', route: 'epo', dataKey: 'cost', seriesSet: 'fuel3' },
        { id: 'avg-cost-fossil-btu', label: 'Average cost of fossil fuels for electricity generation (per Btu)', route: 'epo', dataKey: 'cost-per-btu', seriesSet: 'fuel3' },
        { id: 'sulfur', label: 'Quality of fossil fuels in electricity generation : sulfur content', route: 'epo', dataKey: 'sulfur-content', seriesSet: 'fuel3' },
        { id: 'ash', label: 'Quality of fossil fuels in electricity generation : ash content', route: 'epo', dataKey: 'ash-content', seriesSet: 'fuel3' },
      ],
    },
  ];

  // Full 50 states + DC, plus the US total. Confirmed identical codes on both
  // routes' geo facets (stateid on retail-sales, location on
  // electric-power-operational-data); the two routes diverge only on the
  // census-region aggregate codes (e.g. PACC vs PCC), which aren't used here.
  var STATES = [
    { id: 'US', label: 'United States (Total)' },
    { id: 'AL', label: 'Alabama' },
    { id: 'AK', label: 'Alaska' },
    { id: 'AZ', label: 'Arizona' },
    { id: 'AR', label: 'Arkansas' },
    { id: 'CA', label: 'California' },
    { id: 'CO', label: 'Colorado' },
    { id: 'CT', label: 'Connecticut' },
    { id: 'DE', label: 'Delaware' },
    { id: 'DC', label: 'District of Columbia' },
    { id: 'FL', label: 'Florida' },
    { id: 'GA', label: 'Georgia' },
    { id: 'HI', label: 'Hawaii' },
    { id: 'ID', label: 'Idaho' },
    { id: 'IL', label: 'Illinois' },
    { id: 'IN', label: 'Indiana' },
    { id: 'IA', label: 'Iowa' },
    { id: 'KS', label: 'Kansas' },
    { id: 'KY', label: 'Kentucky' },
    { id: 'LA', label: 'Louisiana' },
    { id: 'ME', label: 'Maine' },
    { id: 'MD', label: 'Maryland' },
    { id: 'MA', label: 'Massachusetts' },
    { id: 'MI', label: 'Michigan' },
    { id: 'MN', label: 'Minnesota' },
    { id: 'MS', label: 'Mississippi' },
    { id: 'MO', label: 'Missouri' },
    { id: 'MT', label: 'Montana' },
    { id: 'NE', label: 'Nebraska' },
    { id: 'NV', label: 'Nevada' },
    { id: 'NH', label: 'New Hampshire' },
    { id: 'NJ', label: 'New Jersey' },
    { id: 'NM', label: 'New Mexico' },
    { id: 'NY', label: 'New York' },
    { id: 'NC', label: 'North Carolina' },
    { id: 'ND', label: 'North Dakota' },
    { id: 'OH', label: 'Ohio' },
    { id: 'OK', label: 'Oklahoma' },
    { id: 'OR', label: 'Oregon' },
    { id: 'PA', label: 'Pennsylvania' },
    { id: 'RI', label: 'Rhode Island' },
    { id: 'SC', label: 'South Carolina' },
    { id: 'SD', label: 'South Dakota' },
    { id: 'TN', label: 'Tennessee' },
    { id: 'TX', label: 'Texas' },
    { id: 'UT', label: 'Utah' },
    { id: 'VT', label: 'Vermont' },
    { id: 'VA', label: 'Virginia' },
    { id: 'WA', label: 'Washington' },
    { id: 'WV', label: 'West Virginia' },
    { id: 'WI', label: 'Wisconsin' },
    { id: 'WY', label: 'Wyoming' },
  ];

  function flatItems() {
    var out = [];
    CATEGORIES.forEach(function (cat) { cat.items.forEach(function (it) { out.push(it); }); });
    return out;
  }

  var dataCache = {}; // keyed by item.id|geo.id|freq -> { rows: [{period, values:{id:num}}], unit: string }

  var state = {
    apiKey: '',
    keyInput: '',
    selectedId: 'net-gen',
    visible: null, // Set of series ids currently shown, initialized below per item
    freq: 'M',
    stateIdx: 0,
    showApi: false,
    dsOpen: false,
    seriesOpen: false,
    geoOpen: false,
    gridExpanded: false,
    loading: false,
    loadError: '',
    rows: [],
    unit: '',
    exportNotice: '',
  };
  try { state.apiKey = window.localStorage.getItem('eiaApiKey') || ''; } catch (e) { /* storage unavailable; proceed without persistence */ }
  state.keyInput = state.apiKey;
  state.visible = new Set(SERIES_SETS[flatItems()[0].seriesSet].map(function (s) { return s.id; }));

  function getSelectedItem() {
    var items = flatItems();
    var found = items.filter(function (it) { return it.id === state.selectedId; })[0];
    return found || items[0];
  }

  function buildApiUrl(item, geo, freq, forDisplay) {
    var routeCfg = ROUTES[item.route];
    var seriesList = SERIES_SETS[item.seriesSet];
    var freqParam = freq === 'M' ? 'monthly' : 'annual';
    var p = [];
    p.push('frequency=' + freqParam);
    p.push('data[]=' + encodeURIComponent(item.dataKey));
    seriesList.forEach(function (s) { p.push('facets[' + routeCfg.seriesFacet + '][]=' + s.id); });
    if (routeCfg.fixedFacets) {
      Object.keys(routeCfg.fixedFacets).forEach(function (k) { p.push('facets[' + k + '][]=' + routeCfg.fixedFacets[k]); });
    }
    p.push('facets[' + routeCfg.geoFacet + '][]=' + geo.id);
    p.push('sort[0][column]=period');
    p.push('sort[0][direction]=desc');
    p.push('length=' + ((PERIODS_WANTED + PERIODS_BUFFER) * seriesList.length));
    p.push('api_key=' + (forDisplay ? 'YOUR_KEY' : encodeURIComponent(state.apiKey)));
    return 'https://api.eia.gov/v2/' + routeCfg.path + '/data/?' + p.join('&');
  }

  function cacheKeyFor(item, geo, freq) { return item.id + '|' + geo.id + '|' + freq; }

  async function loadData() {
    var item = getSelectedItem();
    if (!item.route) { state.rows = []; state.unit = ''; state.loading = false; state.loadError = ''; render(); return; }
    if (!state.apiKey) { state.rows = []; state.loading = false; state.loadError = ''; render(); return; }

    var geo = STATES[state.stateIdx];
    var key = cacheKeyFor(item, geo, state.freq);
    if (dataCache[key]) {
      state.rows = dataCache[key].rows; state.unit = dataCache[key].unit;
      state.loading = false; state.loadError = ''; render();
      return;
    }

    state.loading = true; state.loadError = ''; render();
    var routeCfg = ROUTES[item.route];
    try {
      var url = buildApiUrl(item, geo, state.freq, false);
      var res = await fetch(url);
      var json = await res.json().catch(function () { return null; });
      if (!res.ok || !json || json.error) {
        var msg = (json && json.error) ? json.error : ('HTTP ' + res.status);
        throw new Error(msg);
      }
      var rawRows = (json.response && json.response.data) || [];
      var byPeriod = {};
      var unit = '';
      rawRows.forEach(function (r) {
        var p = r.period;
        if (!byPeriod[p]) { byPeriod[p] = {}; }
        var seriesId = r[routeCfg.seriesFacet];
        var raw = r[item.dataKey];
        byPeriod[p][seriesId] = (raw === null || raw === undefined || raw === '') ? null : parseFloat(raw);
        if (!unit && r[item.dataKey + '-units']) { unit = r[item.dataKey + '-units']; }
      });
      var periods = Object.keys(byPeriod).sort();
      if (periods.length > PERIODS_WANTED) { periods = periods.slice(-PERIODS_WANTED); }
      var rows = periods.map(function (p) { return { period: p, values: byPeriod[p] }; });
      dataCache[key] = { rows: rows, unit: unit };
      state.rows = rows; state.unit = unit; state.loading = false; state.loadError = '';
    } catch (e) {
      state.rows = []; state.unit = ''; state.loading = false;
      state.loadError = "Couldn't load live data (" + (e && e.message ? e.message : 'network error') + ').';
    }
    render();
  }

  function formatPeriod(period, freq) {
    if (freq === 'A') { return period; }
    var parts = period.split('-');
    var MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var mIdx = parseInt(parts[1], 10) - 1;
    return (MONTH_ABBR[mIdx] || parts[1]) + " '" + parts[0].slice(2);
  }

  function buildPath(values, maxVal, w, h, padL, padT, padB) {
    var pts = values.map(function (v, i) { return { v: v, i: i }; }).filter(function (p) { return p.v !== null; });
    if (!pts.length) { return ''; }
    var n = values.length;
    var stepX = (w - padL - 6) / Math.max(n - 1, 1);
    var usableH = h - padT - padB;
    var d = '';
    pts.forEach(function (p, idx) {
      var x = padL + p.i * stepX;
      var y = padT + (usableH - (p.v / (maxVal || 1)) * usableH);
      d += (idx === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
    });
    return d.trim();
  }

  function csvField(v) {
    var s = String(v);
    if (s.indexOf(',') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1) {
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }

  function slugFilename(label, geoId) {
    return label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '-' + geoId.toLowerCase();
  }

  function downloadFile(filename, content, mime) {
    try {
      var blob = new Blob([content], { type: mime });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      state.exportNotice = '';
    } catch (e) {
      state.exportNotice = 'Export failed in this browser (' + (e && e.message ? e.message : 'unknown error') + ').';
    }
    render();
  }

  function currentSeriesList() { return SERIES_SETS[getSelectedItem().seriesSet] || []; }

  function exportCsv() {
    var item = getSelectedItem();
    var geo = STATES[state.stateIdx];
    var seriesList = currentSeriesList().filter(function (s) { return state.visible.has(s.id); });
    if (!seriesList.length || !state.rows.length) { return; }
    var header = ['Period'].concat(seriesList.map(function (s) { return csvField(s.label + (state.unit ? ' (' + state.unit + ')' : '')); }));
    var rows = state.rows.map(function (row) {
      return [row.period].concat(seriesList.map(function (s) {
        var v = row.values[s.id];
        return v === null || v === undefined ? '' : String(v);
      }));
    });
    var csv = [header.join(',')].concat(rows.map(function (r) { return r.join(','); })).join('\n');
    downloadFile(slugFilename(item.label, geo.id) + '.csv', csv, 'text/csv;charset=utf-8');
  }

  function exportChartImage() {
    var item = getSelectedItem();
    var geo = STATES[state.stateIdx];
    var seriesList = currentSeriesList().filter(function (s) { return state.visible.has(s.id); });
    if (!seriesList.length || !state.rows.length) { return; }
    var allVals = [];
    state.rows.forEach(function (row) { seriesList.forEach(function (s) { var v = row.values[s.id]; if (v !== null && v !== undefined) { allVals.push(v); } }); });
    var maxVal = Math.max.apply(null, allVals.concat([1]));
    var W = 900, H = 300, padL = 56, padT = 14, padB = 26;
    var lines = seriesList.map(function (s) {
      var values = state.rows.map(function (row) { var v = row.values[s.id]; return v === undefined ? null : v; });
      return { color: s.color, path: buildPath(values, maxVal, W, H, padL, padT, padB) };
    });
    var yTicks = [0, 0.25, 0.5, 0.75, 1].map(function (f) {
      var val = maxVal * f;
      var y = padT + (H - padT - padB) * (1 - f);
      return { y: y.toFixed(1), yLabelPos: (y + 3.5).toFixed(1), label: Math.round(val).toLocaleString() };
    });
    var n = state.rows.length;
    var xTicks = state.rows.map(function (row, i) {
      var showEvery = n > 8 ? 2 : 1;
      return { x: (padL + i * ((W - padL - 6) / Math.max(n - 1, 1))).toFixed(1), label: (i % showEvery === 0) ? formatPeriod(row.period, state.freq) : '' };
    });

    var parts = [];
    parts.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">');
    parts.push('<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#ffffff"/>');
    yTicks.forEach(function (yt) {
      parts.push('<line x1="56" x2="' + W + '" y1="' + yt.y + '" y2="' + yt.y + '" stroke="#eaeaef" stroke-width="1"/>');
      parts.push('<text x="4" y="' + yt.yLabelPos + '" font-size="10.5" font-family="monospace" fill="#8a8a93">' + yt.label + '</text>');
    });
    xTicks.forEach(function (xt) {
      if (xt.label) { parts.push('<text x="' + xt.x + '" y="' + (H - 6) + '" font-size="10.5" font-family="monospace" fill="#8a8a93" text-anchor="middle">' + xt.label + '</text>'); }
    });
    lines.forEach(function (line) { if (line.path) { parts.push('<path d="' + line.path + '" fill="none" stroke="' + line.color + '" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>'); } });
    parts.push('</svg>');
    downloadFile(slugFilename(item.label, geo.id) + '-chart.svg', parts.join(''), 'image/svg+xml;charset=utf-8');
  }

  function pickItem(id) {
    var item = flatItems().filter(function (it) { return it.id === id; })[0];
    state.selectedId = id;
    state.dsOpen = false;
    state.gridExpanded = false;
    if (item && item.seriesSet) { state.visible = new Set(SERIES_SETS[item.seriesSet].map(function (s) { return s.id; })); }
    render();
    loadData();
  }

  function toggleSeriesItem(id) {
    var next = new Set(state.visible);
    if (next.has(id)) { if (next.size > 1) next.delete(id); }
    else { next.add(id); }
    state.visible = next;
    render();
  }

  function pickState(idx) {
    state.stateIdx = idx;
    state.geoOpen = false;
    render();
    loadData();
  }

  function setFreq(f) { state.freq = f; render(); loadData(); }
  function toggleApi() { state.showApi = !state.showApi; render(); }
  function toggleGridExpanded() { state.gridExpanded = !state.gridExpanded; render(); }
  function toggleDropdown(which) {
    var wasOpen = state[which];
    state.dsOpen = false; state.seriesOpen = false; state.geoOpen = false;
    state[which] = !wasOpen;
    render();
  }
  function closeAllDropdowns() {
    if (!state.dsOpen && !state.seriesOpen && !state.geoOpen) { return; }
    state.dsOpen = false; state.seriesOpen = false; state.geoOpen = false;
    render();
  }

  function saveKey() {
    state.apiKey = (state.keyInput || '').trim();
    try { window.localStorage.setItem('eiaApiKey', state.apiKey); } catch (e) { /* storage unavailable */ }
    dataCache = {};
    render();
    loadData();
  }
  function clearKey() {
    state.apiKey = ''; state.keyInput = '';
    try { window.localStorage.removeItem('eiaApiKey'); } catch (e) { /* storage unavailable */ }
    state.rows = []; state.unit = '';
    render();
  }

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function renderApp() {
    var selectedItem = getSelectedItem();
    var hasRoute = !!selectedItem.route;
    var geo = STATES[state.stateIdx];
    var seriesList = currentSeriesList();
    var visibleSeries = seriesList.filter(function (s) { return state.visible.has(s.id); });

    var html = '';

    // API key bar
    html += '<section class="eb-key-bar">';
    html += '<span class="eb-sub-label" style="margin:0;">EIA API key</span>';
    html += '<input type="password" id="eb-key-input" placeholder="Paste your free api.eia.gov key" value="' + esc(state.keyInput) + '">';
    html += '<button type="button" class="eb-btn eb-btn-sm" data-action="save-key">Save</button>';
    if (state.apiKey) {
      html += '<button type="button" class="eb-btn eb-btn-sm" data-action="clear-key">Clear</button>';
      html += '<span class="eb-key-status eb-key-ok">Saved in this browser</span>';
    } else {
      html += '<span class="eb-key-status">Not set &mdash; register free at eia.gov/opendata/register.php</span>';
    }
    html += '</section>';

    // Change data set
    html += '<section style="position:relative;">';
    html += '<div class="eb-section-label" style="margin-bottom:10px;">Change data set</div>';
    html += '<button type="button" class="eb-dd-trigger" style="width:100%; max-width:440px;" data-action="toggle-dataset" aria-haspopup="listbox" aria-expanded="' + state.dsOpen + '">';
    html += '<span>' + esc(selectedItem.label) + '</span>';
    html += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
    html += '</button>';
    if (state.dsOpen) {
      html += '<div class="eb-dd-panel" role="listbox" aria-label="Change data set" style="width:100%; max-width:440px; max-height:400px; overflow-y:auto;">';
      CATEGORIES.forEach(function (cat) {
        html += '<div class="eb-dd-cat-label">' + esc(cat.label) + '</div>';
        cat.items.forEach(function (it) {
          var selected = it.id === selectedItem.id;
          html += '<button type="button" class="eb-dd-row" role="option" aria-selected="' + selected + '" data-action="pick-item" data-id="' + it.id + '">';
          html += '<span class="eb-check">' + (selected ? '✓' : '') + '</span>' + esc(it.label);
          html += '</button>';
        });
      });
      html += '</div>';
    }
    html += '</section>';

    if (!hasRoute) {
      html += '<section class="eb-nodata">No live route for <strong>' + esc(selectedItem.label) + '</strong> yet &mdash; this one is plant-level EIA-923 data, a different, more granular endpoint this build doesn&rsquo;t cover.<br>Pick anything else in the list above.</section>';
      return html;
    }

    if (!state.apiKey) {
      html += '<section class="eb-keyprompt">Paste your free EIA API key above to load <strong>' + esc(selectedItem.label) + '</strong>.<br>Register at eia.gov/opendata/register.php &mdash; the key arrives by email in a minute or two.</section>';
      return html;
    }

    // Toolbar
    html += '<section class="eb-toolbar">';
    html += '<div style="display:flex; flex-direction:column; gap:8px;">';
    html += '<div class="eb-section-label">Filter / order</div>';
    html += '<div class="eb-filters">';

    var visCount = visibleSeries.length;
    var seriesSummary = visCount === seriesList.length ? 'All series' : (visCount === 1 ? visibleSeries[0].label : visCount + ' of ' + seriesList.length + ' series');
    html += '<div class="eb-dd-wrap">';
    html += '<div class="eb-sub-label">Series</div>';
    html += '<button type="button" class="eb-dd-trigger" style="width:220px;" data-action="toggle-series" aria-haspopup="listbox" aria-expanded="' + state.seriesOpen + '">';
    html += '<span>' + esc(seriesSummary) + '</span>';
    html += '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
    html += '</button>';
    if (state.seriesOpen) {
      html += '<div class="eb-dd-panel" role="listbox" aria-multiselectable="true" aria-label="Series" style="width:220px;">';
      seriesList.forEach(function (s) {
        var on = state.visible.has(s.id);
        html += '<button type="button" class="eb-dd-row" role="option" aria-selected="' + on + '" data-action="toggle-series-item" data-id="' + s.id + '">';
        html += '<span class="eb-swatch-box" style="border-color:' + s.color + '; background:' + (on ? s.color : '#fff') + ';"></span>';
        html += '<span style="' + (on ? 'font-weight:600;' : 'color:#8a8a92; font-weight:500;') + '">' + esc(s.label) + '</span>';
        html += '</button>';
      });
      html += '</div>';
    }
    html += '</div>';

    html += '<div class="eb-dd-wrap">';
    html += '<div class="eb-sub-label">State</div>';
    html += '<button type="button" class="eb-dd-trigger" style="width:190px;" data-action="toggle-geo" aria-haspopup="listbox" aria-expanded="' + state.geoOpen + '">';
    html += '<span>' + esc(geo.label) + '</span>';
    html += '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
    html += '</button>';
    if (state.geoOpen) {
      html += '<div class="eb-dd-panel" role="listbox" aria-label="State" style="width:190px; max-height:360px; overflow-y:auto;">';
      STATES.forEach(function (st, i) {
        var active = i === state.stateIdx;
        html += '<button type="button" class="eb-dd-row" role="option" aria-selected="' + active + '" data-action="pick-state" data-idx="' + i + '">' + esc(st.label) + '</button>';
      });
      html += '</div>';
    }
    html += '</div>';

    html += '</div></div>';

    html += '<div style="display:flex; align-items:center; gap:18px;">';
    html += '<div class="eb-freq">';
    [['M','Monthly'],['A','Annual']].forEach(function (pair) {
      html += '<button type="button" aria-pressed="' + (state.freq === pair[0]) + '" data-action="set-freq" data-freq="' + pair[0] + '">' + pair[1] + '</button>';
    });
    html += '</div>';
    html += '<button type="button" class="eb-btn" data-action="toggle-api" aria-expanded="' + state.showApi + '">';
    html += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>';
    html += (state.showApi ? 'Hide API request' : 'View API request') + '</button>';
    html += '</div>';
    html += '</section>';

    if (state.showApi) {
      var apiUrl = buildApiUrl(selectedItem, geo, state.freq, true);
      html += '<section class="eb-api-panel">';
      html += '<div class="eb-api-title">Live request &mdash; this is the exact call the page makes (key redacted)</div>';
      html += '<div class="num eb-api-url">GET ' + esc(apiUrl) + '</div>';
      html += '</section>';
    }

    // Chart
    html += '<section class="eb-card">';
    html += '<div class="eb-card-head">';
    html += '<h2>' + esc(selectedItem.label) + ', ' + esc(geo.label) + '</h2>';
    html += '<div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">';
    html += '<span class="eb-card-meta">' + (state.freq === 'M' ? 'Monthly' : 'Annual') + (state.unit ? ' &middot; ' + esc(state.unit) : '') + '</span>';
    html += '<button type="button" class="eb-btn eb-btn-sm" data-action="export-image"' + (state.rows.length ? '' : ' disabled') + '>';
    html += '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>';
    html += 'Export image</button>';
    html += '</div></div>';

    if (state.loading) {
      html += '<div class="eb-loading">Loading live data from EIA&hellip;</div>';
    } else if (state.loadError) {
      html += '<div class="eb-error">' + esc(state.loadError) + '</div>';
    } else if (!state.rows.length) {
      html += '<div class="eb-loading">No data returned for this selection.</div>';
    } else {
      var W = 900, H = 300, padL = 56, padT = 14, padB = 26;
      var allVals = [];
      state.rows.forEach(function (row) { visibleSeries.forEach(function (s) { var v = row.values[s.id]; if (v !== null && v !== undefined) { allVals.push(v); } }); });
      var maxVal = Math.max.apply(null, allVals.concat([1]));
      var lines = visibleSeries.map(function (s) {
        var values = state.rows.map(function (row) { var v = row.values[s.id]; return v === undefined ? null : v; });
        return { color: s.color, path: buildPath(values, maxVal, W, H, padL, padT, padB) };
      });
      var yTicks = [0, 0.25, 0.5, 0.75, 1].map(function (f) {
        var val = maxVal * f;
        var y = padT + (H - padT - padB) * (1 - f);
        return { y: y.toFixed(1), yLabelPos: (y + 3.5).toFixed(1), label: Math.round(val).toLocaleString() };
      });
      var n = state.rows.length;
      var showEvery = n > 8 ? 2 : 1;
      var xTicks = state.rows.map(function (row, i) {
        return { x: (padL + i * ((W - padL - 6) / Math.max(n - 1, 1))).toFixed(1), label: (i % showEvery === 0) ? formatPeriod(row.period, state.freq) : '' };
      });
      var chartAriaLabel = 'Line chart: ' + visibleSeries.map(function (s) { return s.label; }).join(', ') + ' for ' + selectedItem.label + ', ' + geo.label + ', ' + (state.unit || '') + '. See the data table below for exact values.';

      html += '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%; height:auto; display:block; margin-top:8px;" role="img" aria-label="' + esc(chartAriaLabel) + '">';
      yTicks.forEach(function (yt) {
        html += '<line x1="56" x2="' + W + '" y1="' + yt.y + '" y2="' + yt.y + '" stroke="#e9e9ea" stroke-width="1"/>';
        html += '<text x="4" y="' + yt.yLabelPos + '" class="num" font-size="10.5" fill="#73737c">' + yt.label + '</text>';
      });
      xTicks.forEach(function (xt) {
        if (xt.label) { html += '<text x="' + xt.x + '" y="' + (H - 6) + '" class="num" font-size="10.5" fill="#73737c" text-anchor="middle">' + xt.label + '</text>'; }
      });
      lines.forEach(function (line) {
        if (line.path) { html += '<path d="' + line.path + '" fill="none" stroke="' + line.color + '" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>'; }
      });
      html += '</svg>';
    }
    if (state.exportNotice) { html += '<div class="eb-notice" role="alert">' + esc(state.exportNotice) + '</div>'; }
    html += '</section>';

    // Grid
    if (!state.loading && !state.loadError && state.rows.length) {
      var visibleCount = state.gridExpanded ? 12 : 4;
      var shownRows = state.rows.slice(-visibleCount);
      html += '<section class="eb-card eb-grid-card">';
      html += '<div class="eb-grid-head">';
      html += '<h2>Values, last ' + shownRows.length + ' periods &mdash; ' + esc(geo.label) + (state.unit ? ' (' + esc(state.unit) + ')' : '') + '</h2>';
      html += '<div style="display:flex; align-items:center; gap:14px;">';
      html += '<button type="button" class="eb-link-btn" data-action="toggle-grid-expand">' + (state.gridExpanded ? 'Show fewer' : 'Show 8 more') + '</button>';
      html += '<button type="button" class="eb-btn eb-btn-sm" data-action="export-csv">';
      html += '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';
      html += 'Export CSV</button>';
      html += '</div></div>';
      html += '<div class="eb-note" style="padding:0 0 10px;">CSV export includes every period this page has loaded, not just what&rsquo;s shown here</div>';
      html += '<table><caption style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);">' + esc(selectedItem.label) + ' by series, ' + esc(geo.label) + '</caption>';
      html += '<thead><tr><th scope="col">Series</th>';
      shownRows.forEach(function (row) { html += '<th scope="col" class="num">' + esc(formatPeriod(row.period, state.freq)) + '</th>'; });
      html += '</tr></thead><tbody>';
      seriesList.forEach(function (s) {
        var on = state.visible.has(s.id);
        html += '<tr style="' + (on ? 'opacity:1;' : 'opacity:.32;') + '">';
        html += '<th scope="row"><span class="eb-swatch-box" style="border-color:' + s.color + '; background:' + s.color + '; width:9px; height:9px; border-radius:2px;"></span>' + esc(s.label) + '</th>';
        shownRows.forEach(function (row) {
          var v = row.values[s.id];
          html += '<td class="num">' + (v === null || v === undefined ? '&mdash;' : v.toLocaleString()) + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      html += '</section>';
    }

    return html;
  }

  function render() {
    document.getElementById('eb-app').innerHTML = renderApp();
    var badge = document.getElementById('eb-live-badge');
    if (state.apiKey) { badge.textContent = 'Live'; badge.className = 'eb-badge eb-badge-live'; }
    else { badge.textContent = 'Sample data'; badge.className = 'eb-badge eb-badge-off'; }
  }

  document.addEventListener('click', function (event) {
    var actionEl = event.target.closest('[data-action]');
    if (!actionEl || !document.getElementById('eb-root').contains(actionEl)) {
      closeAllDropdowns();
      return;
    }
    var action = actionEl.getAttribute('data-action');
    switch (action) {
      case 'toggle-dataset': toggleDropdown('dsOpen'); break;
      case 'toggle-series': toggleDropdown('seriesOpen'); break;
      case 'toggle-geo': toggleDropdown('geoOpen'); break;
      case 'pick-item': pickItem(actionEl.getAttribute('data-id')); break;
      case 'toggle-series-item': toggleSeriesItem(actionEl.getAttribute('data-id')); break;
      case 'pick-state': pickState(parseInt(actionEl.getAttribute('data-idx'), 10)); break;
      case 'set-freq': setFreq(actionEl.getAttribute('data-freq')); break;
      case 'toggle-api': toggleApi(); break;
      case 'toggle-grid-expand': toggleGridExpanded(); break;
      case 'export-csv': exportCsv(); break;
      case 'export-image': exportChartImage(); break;
      case 'save-key': saveKey(); break;
      case 'clear-key': clearKey(); break;
    }
  });

  document.addEventListener('input', function (event) {
    if (event.target && event.target.id === 'eb-key-input') { state.keyInput = event.target.value; }
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') { closeAllDropdowns(); }
    if (event.key === 'Enter' && event.target && event.target.id === 'eb-key-input') { saveKey(); }
  });

  render();
  if (state.apiKey) { loadData(); }
})();
</script>
</body>
</html>
